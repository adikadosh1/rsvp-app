<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="הושבה כיד המלך - סמל">
  <defs>
    <style>
      .gold { fill: #d8b55b; }
      .ink { fill: #0f1216; }
      .strokeGold { stroke: #d8b55b; }
    </style>
  </defs>

  <rect x="56" y="56" width="400" height="400" rx="56" class="ink"/>

  <g transform="translate(128,120) scale(1.15)" aria-hidden="true">
    <!-- Crown + Throne (unique mark) -->
    <path class="gold" opacity="0.96" d="M18 234h188v30H18v-30Z" />
    <!-- Crown top (sharper, more premium silhouette) -->
    <path class="gold" opacity="0.92" d="M22 198 44 120 76 158 112 98 148 158 180 120 202 198 22 198Z" />
    <!-- Crown jewels -->
    <path class="gold" opacity="0.55" d="M48 120a12 12 0 1 0 0.001 0ZM112 92a12 12 0 1 0 0.001 0ZM176 120a12 12 0 1 0 0.001 0Z" />

    <!-- Throne backrest (tall + royal) -->
    <path
      class="gold"
      opacity="0.36"
      d="M58 230v-60c0-30 24-54 54-54s54 24 54 54v60h-22v-60c0-18-14-32-32-32s-32 14-32 32v60H58Z"
    />

    <!-- Armrests -->
    <path class="gold" opacity="0.22" d="M40 232c0-18 8-30 24-38v32c-10 5-14 12-14 24H40Z" />
    <path class="gold" opacity="0.22" d="M190 232c0-18-8-30-24-38v32c10 5 14 12 14 24h10Z" />

    <!-- Seat cushion (subtle) -->
    <path class="gold" opacity="0.16" d="M54 250c16-10 36-15 58-15s42 5 58 15c-18 10-38 15-58 15s-40-5-58-15Z" />

    <!-- Seat arc -->
    <path
      class="strokeGold"
      opacity="0.44"
      d="M22 290c30-22 62-33 94-33s64 11 94 33"
      stroke-width="6"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Base line -->
    <path class="strokeGold" opacity="0.32" d="M10 308h204" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>
</svg>

